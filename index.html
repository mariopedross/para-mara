<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Mara</title>
<meta name="theme-color" content="#0b1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   El contenido se edita en CONFIG (en el <script>).
   Las fotos van en /media.
   ========================================================= */
:root{
  --bg:#f9ecee; --bg2:#f3dde0; --card:#fffafa; --ink:#3b2a2d; --soft:#8a7275;
  --accent:#b3263c; --accent2:#e07a8a; --line:#ecd3d7; --gold:#e8c27a;
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
.wrap{max-width:460px;margin:0 auto;background:linear-gradient(var(--bg),var(--bg2) 50%,var(--bg));min-height:100vh;position:relative;overflow:hidden}
section{padding:60px 24px}
.kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);text-align:center;margin-bottom:10px}
h2{font-family:var(--serif);font-weight:400;font-size:30px;text-align:center;line-height:1.2}
.sub{color:var(--soft);font-size:14px;text-align:center;margin-top:10px;line-height:1.55}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* =================== INTRO: CIELO ESTRELLADO =================== */
#sky{position:fixed;inset:0;z-index:50;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#3a2550 0%,#161a3d 45%,#070a1c 100%);transition:opacity 1.6s ease,visibility 1.6s}
#sky.gone{opacity:0;visibility:hidden}
#sky .bgstar{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#sky .sea{position:absolute;left:0;right:0;bottom:0;height:22%;
  background:linear-gradient(#141a3a,#0a0d22);border-top:1px solid rgba(255,255,255,.08)}
#sky .sea::before{content:"";position:absolute;left:10%;right:10%;top:6px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shimmer 4s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.3;transform:scaleX(.7)}}
#sky .txt{position:absolute;left:0;right:0;top:9%;text-align:center;color:#f4e9f2;padding:0 30px;z-index:3}
#sky .txt p{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;transition:opacity .8s}
#sky .txt small{display:block;margin-top:12px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#b9a9c9}
#lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#lines line{stroke:url(#lg);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bstar{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;z-index:2;cursor:pointer;display:grid;place-items:center;border:0;background:none}
.bstar i{width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  transform:scale(1.4);filter:drop-shadow(0 0 6px #fff);animation:pulse 1.8s ease-in-out infinite;transition:transform .4s}
.bstar::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.35);animation:ring 1.8s ease-out infinite}
@keyframes pulse{50%{transform:scale(1.9)}}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.bstar.on i{background:var(--gold);transform:scale(2.4);animation:none;filter:drop-shadow(0 0 12px var(--gold))}
.bstar.on::after{display:none}
.bstar.next::after{border-color:var(--gold)}
#skip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:4;color:#8f86a8;font-size:11px;letter-spacing:.15em;background:none;border:0;text-decoration:underline;cursor:pointer}

/* =================== PORTADA =================== */
.hero{padding:0;position:relative}
.hero .photo{height:78vh;min-height:460px;max-height:700px;position:relative;overflow:hidden}
.hero .photo img{width:100%;height:100%;object-fit:cover;object-position:center 62%;transform:scale(1.1);transition:transform 7s ease}
.hero.in .photo img{transform:scale(1)}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(30,10,15,.8))}
.hero .txt{position:absolute;left:0;right:0;bottom:38px;text-align:center;color:#fff;z-index:2}
.hero .para{font-size:11px;letter-spacing:.4em;text-transform:uppercase;opacity:.85}
.hero h1{font-family:var(--serif);font-weight:400;font-size:58px;line-height:1.05;margin:6px 0}
.hero .names{font-family:var(--serif);font-style:italic;font-size:17px}
.hero .date{font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-top:14px;opacity:.8}
.counter{display:flex;justify-content:center;gap:10px;padding:30px 20px 0}
.counter div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;min-width:78px;text-align:center}
.counter b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--accent)}
.counter span{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}

/* =================== CANCIÓN =================== */
.disc-wrap{display:flex;justify-content:center;margin:30px 0 18px}
.disc{width:220px;height:220px;border-radius:50%;position:relative;cursor:pointer;
  background:repeating-radial-gradient(circle,#1b1316 0 2px,#271c20 2px 4px);box-shadow:0 20px 40px rgba(80,20,35,.3)}
.disc img{position:absolute;inset:22%;width:56%;height:56%;border-radius:50%;object-fit:cover;border:3px solid #fff3f5}
.disc.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.disc .btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
  background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 16px rgba(179,38,60,.45);z-index:2}
.btn svg{width:20px;height:20px;fill:#fff}
.song-title{font-family:var(--serif);font-size:22px;text-align:center}
.song-artist{text-align:center;color:var(--soft);font-size:13px;margin-top:4px;font-style:italic}
.player{margin-top:18px;border-radius:14px;overflow:hidden}

/* =================== CARTA =================== */
.letter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 24px;margin-top:26px;box-shadow:0 10px 30px rgba(140,40,60,.08);position:relative}
.letter::before{content:"";position:absolute;top:0;left:24px;right:24px;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:0 0 3px 3px}
.letter p{font-family:var(--serif);font-size:16.5px;line-height:1.75;margin-bottom:16px;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.letter p.in{opacity:1;transform:none}
.letter .hi{font-style:italic;font-size:19px}
.letter .sign{text-align:right;font-style:italic;margin:0}

/* =================== CAPÍTULOS =================== */
.book-intro{padding-bottom:10px}
.chap{padding:46px 24px 30px;position:relative}
.chap .num{font-family:var(--serif);font-size:13px;letter-spacing:.35em;color:var(--accent);text-align:center;text-transform:uppercase}
.chap .num::before,.chap .num::after{content:"";display:inline-block;width:28px;height:1px;background:var(--accent2);vertical-align:middle;margin:0 12px;opacity:.6}
.chap h3{font-family:var(--serif);font-weight:400;font-size:29px;text-align:center;margin:10px 0 22px;line-height:1.2}
.frame{position:relative;background:#fff;padding:12px 12px 14px;border-radius:6px;box-shadow:0 18px 40px rgba(90,30,45,.18);
  transform:rotate(var(--r,-1.5deg));transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.chap.reveal:not(.in) .frame{transform:rotate(calc(var(--r,-1.5deg) * 4)) translateY(30px) scale(.94)}
.frame img,.frame svg{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;background:#eee}
.frame .tape{position:absolute;top:-12px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,200,200,.75);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.chap p.story{font-family:var(--serif);font-size:17px;line-height:1.75;text-align:center;margin-top:24px;color:#4a3539}
.chap p.story.quote{font-style:italic}
.chap .heart-sep{text-align:center;color:var(--accent2);margin-top:26px;font-size:14px;letter-spacing:12px}
.chap.final h3{font-size:36px}

/* =================== COSAS QUE ME ENAMORAN =================== */
.flipgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.flip{perspective:900px;height:130px;cursor:pointer}
.flip .in3d{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .in3d{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:14px;text-align:center}
.flip .f{background:linear-gradient(145deg,#c93a55,#8f1a2c);color:#fff;box-shadow:0 10px 22px rgba(143,26,44,.28)}
.flip .f span{font-family:var(--serif);font-size:30px}
.flip .f small{position:absolute;bottom:10px;font-size:9px;letter-spacing:.25em;opacity:.75}
.flip .b{background:var(--card);border:1px solid var(--line);transform:rotateY(180deg);font-family:var(--serif);font-size:16px;line-height:1.4;color:var(--ink);box-shadow:0 10px 22px rgba(140,40,60,.1)}
.flipcount{text-align:center;margin-top:18px;font-size:12px;letter-spacing:.2em;color:var(--soft)}
.allflip{text-align:center;font-family:var(--serif);font-style:italic;font-size:19px;margin-top:16px;opacity:0;transition:opacity 1s}
.allflip.show{opacity:1}

/* =================== SORPRESA: RASCA Y GANA =================== */
.surprise{text-align:center;padding-bottom:80px}
.heart{font-size:30px;color:var(--accent);animation:beat 1.4s infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.scratch{position:relative;margin:30px -6px 0;border-radius:22px;overflow:hidden;aspect-ratio:1080/1350;box-shadow:0 24px 50px rgba(40,10,30,.4);background:#1d0b1a}
.scratch img{width:100%;height:100%;object-fit:cover;display:block}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity 1.2s ease}
.scratch canvas.done{opacity:0;pointer-events:none}
.scratch-hint{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-top:16px}
footer{text-align:center;font-family:var(--serif);font-style:italic;color:var(--soft);padding:0 30px 60px;font-size:15px;line-height:1.6}

.ph{background:linear-gradient(135deg,#e9c3ca,#c9798a);display:grid;place-items:center;color:#fff;font-size:12px;text-align:center}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">

<!-- ================= INTRO ================= -->
<div id="sky">
  <div class="txt"><p id="skyText"></p><small id="skyHint"></small></div>
  <svg id="lines"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#f6d58f"/><stop offset="1" stop-color="#f19bb0"/></linearGradient></defs></svg>

</div>

<div class="wrap">

  <section>

  <section class="book-intro reveal">

  <!-- COSAS QUE ME ENAMORAN -->
  <section class="reveal">
    <div class="kicker">Toca cada tarjeta</div>

    <div class="scratch-hint" id="scrHint">Rasca con el dedo ✨</div>
  </section>
  <footer id="foot"></footer>
</div>
<canvas id="confetti"></canvas>

  </svg>`,
  avion: `<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6c2"/><stop offset=".45" stop-color="#f7a7b5"/><stop offset="1" stop-color="#8a6fb0"/></linearGradient>

    <rect width="400" height="500" fill="url(#s2)"/>

    <rect y="300" width="400" height="200" fill="url(#o2)"/>
    ${Array.from({length:9},(_,i)=>`<path d="M${i*50-20} ${330+i*18} q12 -6 24 0 t24 0" stroke="#c9d4ff" stroke-width="1.5" fill="none" opacity=".5"><animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="${4+i%3}s" repeatCount="indefinite"/></path>`).join('')}

/* ---------- Intro: estrellas ---------- */
(function sky(){
  const sky = $('#sky'), svg = $('#lines');
  $('#skyText').textContent = CONFIG.intro.texto; $('#skyHint').textContent = CONFIG.intro.pista;
  for (let i = 0; i < 90; i++) { const s = document.createElement('i'); s.className = 'bgstar'; const z = Math.random() * 2 + .6;
    s.style.cssText = `width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*78}%;animation-delay:${-Math.random()*3}s;animation-duration:${2+Math.random()*3}s`; sky.appendChild(s); }
  // Estrellas que forman un corazón
  const pts = [[50,40],[36,31],[24,38],[25,52],[38,63],[50,72],[62,63],[75,52],[76,38],[64,31]];
  let idx = 0; const W = () => sky.clientWidth, H = () => sky.clientHeight;
  const stars = pts.map(([x,y], i) => { const b = document.createElement('button'); b.className = 'bstar' + (i === 0 ? ' next' : '');
    b.style.left = x + '%'; b.style.top = y + '%'; b.setAttribute('aria-label','estrella'); b.innerHTML = '<i></i>'; sky.appendChild(b);
    b.onclick = () => { if (i !== idx) return; b.classList.remove('next'); b.classList.add('on');
      if (i > 0) line(pts[i-1], pts[i]); idx++;
      if (idx < pts.length) stars[idx].classList.add('next'); else { line(pts[pts.length-1], pts[0]); finish(); } };
    return b; });
  function line(a, b){ const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1', a[0]/100*W()); l.setAttribute('y1', a[1]/100*H()); l.setAttribute('x2', b[0]/100*W()); l.setAttribute('y2', b[1]/100*H()); svg.appendChild(l); }
  function finish(){
    const p = $('#skyText'); p.style.opacity = 0; $('#skyHint').style.opacity = 0;
    setTimeout(() => { p.textContent = CONFIG.intro.final; p.style.opacity = 1; }, 900);
    setTimeout(open, 3600);
  }
  function open(){ sky.classList.add('gone'); document.body.classList.remove('locked'); window.scrollTo(0,0); observe(); }
  $('#skip').onclick = open;
})();

/* ---------- Portada ---------- */
const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const start = new Date(CONFIG.inicio + 'T00:00:00');
$('#h-name').textContent = CONFIG.para;
$('#h-names').textContent = `${CONFIG.para} y ${CONFIG.de}`;
$('#h-date').textContent = `Desde el ${start.getDate()} de ${months[start.getMonth()]} de ${start.getFullYear()}`;
document.querySelectorAll('[data-src]').forEach(i => setImg(i, CONFIG.fotos[i.dataset.src]));
function tick(){ const ms = Date.now() - start; const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  $('#counter').innerHTML = `<div><b>${d}</b><span>días</span></div><div><b>${h}</b><span>horas</span></div><div><b>${m}</b><span>minutos</span></div>`; }
tick(); setInterval(tick, 30000);

/* ---------- Canción ---------- */
$('#songTitle').textContent = CONFIG.cancion.titulo; $('#songArtist').textContent = CONFIG.cancion.artista;
$('#player').innerHTML = `<iframe src="https://suno.com/embed/${CONFIG.cancion.sunoId}" width="100%" height="240" frameborder="0" allow="autoplay; clipboard-write; encrypted-media" loading="lazy"></iframe>`;
const disc = $('#disc'), discBtn = $('#discBtn'); discBtn.innerHTML = PLAY;
disc.onclick = () => { const on = disc.classList.toggle('spin'); discBtn.innerHTML = on ? PAUSE : PLAY; };

/* ---------- Carta ---------- */
const letter = $('#letter');
CONFIG.carta.forEach((t, i) => { const p = document.createElement('p'); p.textContent = t; if (i === 0) p.className = 'hi'; letter.appendChild(p); });
const sign = document.createElement('p'); sign.className = 'sign'; sign.textContent = '— ' + CONFIG.de; letter.appendChild(sign);

/* ---------- Capítulos ---------- */
const chWrap = $('#chapters');
CONFIG.capitulos.forEach((c, i) => {
  const s = document.createElement('section'); s.className = 'chap reveal' + (c.final ? ' final' : '');
  s.innerHTML = `<div class="num">Capítulo ${ROMAN[i]}</div><h3>${c.titulo}</h3>
    <div class="frame" style="--r:${c.giro || 0}deg"><div class="tape"></div>${c.ilustracion ? ILU[c.ilustracion] : '<img alt="">'}</div>
    <p class="story${c.cita ? ' quote' : ''}">${c.cita ? '“' + c.texto + '”' : c.texto}</p>
    ${i < CONFIG.capitulos.length - 1 ? '<div class="heart-sep">· ♥ ·</div>' : ''}`;
  chWrap.appendChild(s); if (c.foto) setImg(s.querySelector('img'), c.foto);
});

/* ---------- Cosas que me enamoran ---------- */
const grid = $('#flipgrid'); let flipped = 0; const total = CONFIG.enamoran.length;
const upd = () => $('#flipcount').textContent = `${flipped} / ${total}`;
CONFIG.enamoran.forEach((t, i) => {
  const f = document.createElement('div'); f.className = 'flip';
  f.innerHTML = `<div class="in3d"><div class="f"><span>♥</span><small>${String(i+1).padStart(2,'0')}</small></div><div class="b">${t}</div></div>`;
  f.onclick = () => { if (f.classList.contains('on')) return; f.classList.add('on'); flipped++; upd();
    if (flipped === total) { setTimeout(() => { $('#allflip').textContent = CONFIG.enamoranFinal; $('#allflip').classList.add('show'); confetti(.45); }, 700); } };
  grid.appendChild(f);
}); upd();

/* ---------- Sorpresa: rasca y gana ---------- */
$('#malo').textContent = CONFIG.antesDeLaSorpresa;
$('#foot').textContent = CONFIG.despedida;
setImg($('#gImg'), CONFIG.sorpresa);
(function scratch(){
  const cv = $('#scr'), box = $('#scratch'); let ctx, w, h, drawing = false, done = false, moves = 0;
  function paint(){
    const r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#c9a24c'); g.addColorStop(.3, '#f6dc94'); g.addColorStop(.55, '#d4ab55'); g.addColorStop(.8, '#f3d58a'); g.addColorStop(1, '#b98c37');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(255,255,255,${Math.random()*.25})`; ctx.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4); }
    ctx.fillStyle = 'rgba(110,70,20,.85)'; ctx.textAlign = 'center';
    ctx.font = '600 13px Inter, sans-serif'; ctx.fillText('B O L E T O   P R E M I A D O', w/2, h*.36);
    ctx.font = 'italic 34px "Playfair Display", Georgia, serif'; ctx.fillText('Rasca aquí', w/2, h*.48);
    ctx.font = '40px serif'; ctx.fillText('✨', w/2, h*.6);
    ctx.globalCompositeOperation = 'destination-out';
  }
  function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  let last = null;
  function scr(e){ if (!drawing || done) return; const [x, y] = pos(e); ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); if (last) ctx.moveTo(last[0], last[1]); else ctx.moveTo(x, y); ctx.lineTo(x, y); ctx.stroke(); last = [x, y];
    if (++moves % 12 === 0) check(); }
  function check(){
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, n = 0;
    for (let i = 3; i < d.length; i += 4 * 40) { n++; if (d[i] < 40) clear++; }
    if (clear / n > .5) { done = true; cv.classList.add('done'); $('#scrHint').textContent = '¡Nos vamos de concierto! 🎶'; confetti(.5); }
  }
  cv.addEventListener('pointerdown', e => { drawing = true; last = null; cv.setPointerCapture(e.pointerId); scr(e); });
  cv.addEventListener('pointermove', scr);
  ['pointerup','pointercancel','pointerleave'].forEach(ev => cv.addEventListener(ev, () => { drawing = false; last = null; if (!done) check(); }));
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(paint);
  let rw = innerWidth; addEventListener('resize', () => { if (!done && innerWidth !== rw) { rw = innerWidth; paint(); } });
})();

/* ---------- Confeti ---------- */
function confetti(yPos = .55){
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#b3263c', '#e07a8a', '#f4b6c2', '#f6d58f', '#fff'];
  const ps = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight * yPos, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4,
    s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)], h: Math.random() < .3 }));
  let t = 0;
  (function f(){ x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.h) { x.font = p.s * 2.4 + 'px serif'; x.fillText('♥', 0, 0); } else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++t < 220) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ---------- Animaciones al bajar ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; e.target.classList.add('in');
  if (e.target.id === 'letter') [...e.target.children].forEach((p, i) => setTimeout(() => p.classList.add('in'), 250 + i * 650));
  io.unobserve(e.target);
}), { threshold: .15 });
function observe(){ document.querySelectorAll('.reveal').forEach(el => io.observe(el)); }
</script>
